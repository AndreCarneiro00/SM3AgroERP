spring:
  application:
    name: SM3AgroERP

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  servlet:
    context-path: /api
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

sm3:
  storage:
    attachments:
      local-root: uploads/financial-attachments
